# Configuration of sources


version: 2

sources:
  - name: jaffle_shop                                              # source name that I provide; used as an argument in source() macro. Usually it represents your database and schema.
    description: A clone of a Postgres application database.       # source level description 
    database: dbt-tutorial                                         # equivalent of project name in Bigquery
    schema: jaffle_shop                                            # provide schema/dataset name
    tables:
      - name: customers                                            # table name that we are sourcing data from 
        description: Raw customers data.                           # table level description 
        columns: # "data_tests" would work as well
          - name: id                                               # provide column name as it is coming from the sources (no alias provided in staging model)
            description: Primary key for customer data.                # column level description 
            tests:                                                 # generic tests for sources
              - unique
              - not_null
      - name: orders                                               # table name that we are sourcing data from 
        description: Raw orders data.                              # table level description
        columns:
          - name: id                                               # provide column name as it is coming from the sources (no alias provided in staging model)
            description: Primary key for orders data.                   # column level description 
            tests: # "data_tests" would work as well               # generic tests for sources
              - unique
              - not_null
        
        # Configuring source freshness 
        loaded_at_field: _etl_loaded_at                            # column that dbt will use to check last load time
        config:
          freshness:                                                 # configuration of source freshness
            warn_after: {count: 12, period: hour}                    # period when dbt will issue a warning if data is getting stale
            error_after: {count: 24, period: hour}                   # period when dbt will throw an error if data is critically outdated
        
        # Another way to configure source freshness
        
        #freshness:
        #  warn_after:
        #    count: 12
        #    period: hour
        #  error_after: 
        #    count: 1
        #    period: day
        #loaded_at_field: _etl_loaded_at
        